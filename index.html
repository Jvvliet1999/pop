<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2a44">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="POP">
  <title>Persoonlijk ontwikkelplan</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script>
    // Gekozen thema meteen toepassen (voorkomt flitsen)
    try { const t = localStorage.getItem('pop-thema'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <style>
    :root {
      --bg: #f6f5f1;
      --surface: #ffffff;
      --text: #1d2230;
      --muted: #7a7f8c;
      --line: #e6e3db;
      --accent: #1f2a44;
      --on-accent: #ffffff;
      --good: #2f8a4a;
      --good-soft: #e3f2e6;
      --bad: #b8483a;
      --bad-soft: #f8e4e1;
      --sun: #d48a1c;
      --sun-soft: #fbf0dc;
      --moon: #4b5fa8;
      --moon-soft: #e6e9f6;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #12151c;
        --surface: #1b2029;
        --text: #eceae4;
        --muted: #8d93a1;
        --line: #2a303b;
        --accent: #c9d3ea;
        --on-accent: #12151c;
        --good: #6cc184;
        --good-soft: #1e3324;
        --bad: #e2836f;
        --bad-soft: #3a2420;
        --sun: #e8aa4a;
        --sun-soft: #3a2f1c;
        --moon: #97a8e6;
        --moon-soft: #232a42;
      }
    }
    :root[data-theme="dark"] {
        --bg: #12151c;
        --surface: #1b2029;
        --text: #eceae4;
        --muted: #8d93a1;
        --line: #2a303b;
        --accent: #c9d3ea;
        --on-accent: #12151c;
        --good: #6cc184;
        --good-soft: #1e3324;
        --bad: #e2836f;
        --bad-soft: #3a2420;
        --sun: #e8aa4a;
        --sun-soft: #3a2f1c;
        --moon: #97a8e6;
        --moon-soft: #232a42;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      font-size: 16px;
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: none; }

    header {
      padding: calc(env(safe-area-inset-top) + 20px) 20px 8px;
      max-width: 640px; margin: 0 auto;
      display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
    }
    .thema-knop {
      width: 42px; height: 42px; border-radius: 50%; flex: none;
      background: var(--surface); border: 1px solid var(--line);
      display: grid; place-items: center; font-size: 19px; margin-bottom: 2px;
    }
    .kop-knoppen { display: flex; gap: 8px; }
    #settings-knop.aan { background: var(--accent); border-color: var(--accent); }
    .datum { font-size: 13px; color: var(--muted); letter-spacing: .02em; }
    .datum::first-letter { text-transform: uppercase; }
    h1 { font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; }
    main {
      padding: 8px 20px calc(env(safe-area-inset-bottom) + 96px);
      max-width: 640px; margin: 0 auto;
    }
    section[data-view] { display: none; }
    section[data-view].actief { display: block; }

    .kaart {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin-top: 12px;
    }
    .kaart-kop { display: flex; align-items: center; gap: 10px; }
    .kaart-kop h2 { font-size: 16px; font-weight: 650; flex: 1; }
    .label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 24px 0 4px; }
    .sub { font-size: 13px; color: var(--muted); }
    .icoon {
      width: 34px; height: 34px; border-radius: 10px; flex: none;
      display: grid; place-items: center; font-size: 17px;
    }
    .i-bad { background: var(--bad-soft); color: var(--bad); }
    .i-good { background: var(--good-soft); color: var(--good); }
    .i-sun { background: var(--sun-soft); color: var(--sun); }
    .i-moon { background: var(--moon-soft); color: var(--moon); }

    .ov-kaart { display: block; width: 100%; text-align: left; }
    .ov-getal { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin-top: 12px; }
    .ov-getal small { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 4px; }
    .balk { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 8px; }
    .balk > i { display: block; height: 100%; border-radius: 3px; background: var(--good); transition: width .3s; }
    .ov-rij { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 12px; }
    .ov-rij .sub { display: flex; justify-content: space-between; }
    .pijl { color: var(--muted); font-size: 18px; }

    .leeg {
      margin-top: 12px; border: 1.5px dashed var(--line); border-radius: 16px;
      padding: 32px 20px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.5;
    }
    .leeg strong { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }

    .knop {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 15px;
      background: var(--accent); color: var(--on-accent);
    }
    .knop.breed { width: 100%; margin-top: 16px; padding: 14px; }
    .knop.zacht { background: var(--surface); color: var(--text); border: 1px solid var(--line); }
    .knop.klein { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
    .knop.rood { background: var(--bad-soft); color: var(--bad); }
    .tekstknop { color: var(--muted); font-size: 14px; padding: 6px 4px; }

    /* Slechte gewoontes */
    .vrij { display: flex; align-items: baseline; gap: 6px; margin-top: 14px; }
    .vrij b { font-size: 34px; letter-spacing: -.03em; }
    .vrij span { color: var(--muted); font-size: 14px; }
    .stats { display: flex; gap: 16px; margin-top: 4px; }
    .acties { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

    /* Goede gewoontes */
    .gw-rij { display: flex; align-items: center; gap: 12px; }
    .vink {
      width: 44px; height: 44px; border-radius: 50%; flex: none;
      border: 2px solid var(--line); display: grid; place-items: center;
      font-size: 20px; color: transparent; transition: all .15s;
    }
    .vink.aan { background: var(--good); border-color: var(--good); color: var(--on-accent); }
    .gw-info { flex: 1; min-width: 0; }
    .gw-naam { font-weight: 600; overflow-wrap: anywhere; }
    .week { display: flex; gap: 5px; margin-top: 12px; }
    .dag { flex: 1; text-align: center; font-size: 11px; color: var(--muted); }
    .dag i { display: block; height: 8px; border-radius: 4px; background: var(--line); margin-top: 4px; }
    .dag.ja i { background: var(--good); }
    .dag.vandaag { color: var(--text); font-weight: 700; }

    /* Routine */
    .tabs { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-top: 12px; }
    .tabs button { flex: 1; padding: 9px; border-radius: 9px; font-weight: 600; font-size: 15px; color: var(--muted); }
    .tabs button.aan { background: var(--accent); color: var(--on-accent); }
    .stap {
      display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
      padding: 13px 0; border-bottom: 1px solid var(--line);
    }
    .stap:last-child { border-bottom: none; }
    .stap .box {
      width: 26px; height: 26px; border-radius: 8px; flex: none;
      border: 2px solid var(--line); display: grid; place-items: center; font-size: 15px; color: transparent;
    }
    .stap.aan .box { background: var(--good); border-color: var(--good); color: var(--on-accent); }
    .stap.aan .tekst { color: var(--muted); text-decoration: line-through; }
    .stap .tekst { flex: 1; overflow-wrap: anywhere; }
    .stap .weg { color: var(--bad); font-size: 14px; padding: 4px 8px; }
    .toevoegen { display: flex; gap: 8px; margin-top: 12px; }
    .toevoegen input {
      flex: 1; min-width: 0; padding: 11px 12px; border-radius: 12px;
      border: 1px solid var(--line); background: var(--bg);
    }
    .compleet { color: var(--good); font-weight: 600; font-size: 14px; margin-top: 10px; text-align: center; }

    /* Dashboard */
    .welkom {
      margin-top: 8px; border-radius: 22px; padding: 22px 20px 20px;
      background: linear-gradient(145deg, #ffd9a0 0%, #ffb38a 55%, #f7949a 100%);
      color: #3b2116; position: relative; overflow: hidden;
      box-shadow: 0 10px 30px -14px rgba(214, 110, 60, .55);
    }
    .welkom.avond {
      background: linear-gradient(145deg, #3d3a78 0%, #6a4c93 55%, #c06c84 100%);
      color: #fff4ec; box-shadow: 0 10px 30px -14px rgba(80, 60, 140, .6);
    }
    .welkom::after {
      content: ""; position: absolute; width: 180px; height: 180px; border-radius: 50%;
      right: -50px; top: -60px; background: rgba(255, 255, 255, .22);
    }
    .welkom > * { position: relative; z-index: 1; }
    .welkom-emoji { font-size: 34px; line-height: 1; }
    .welkom-groet { font-size: 25px; font-weight: 750; letter-spacing: -.02em; margin-top: 10px; }
    .welkom-zin { font-size: 15px; line-height: 1.45; margin-top: 8px; font-style: italic; }
    .welkom-bron { font-size: 12.5px; font-weight: 600; margin-top: 6px; opacity: .75; }
    .klok {
      margin-top: 18px; padding: 14px 16px; border-radius: 16px;
      background: rgba(255, 255, 255, .35); backdrop-filter: blur(6px);
      display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    }
    .welkom.avond .klok { background: rgba(255, 255, 255, .14); }
    .klok-tijd { font-size: 38px; font-weight: 750; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .klok-plaats { font-size: 13px; font-weight: 600; opacity: .8; }

    /* Bibliotheek */
    .bieb-groep { display: flex; align-items: baseline; justify-content: space-between; }
    .item { display: flex; gap: 12px; align-items: flex-start; padding: 13px 0; border-bottom: 1px solid var(--line); }
    .item:last-child { border-bottom: none; }
    .omslag {
      width: 40px; height: 54px; border-radius: 6px; flex: none;
      display: grid; place-items: center; font-size: 18px; font-weight: 700; color: #fff;
    }
    .omslag.audio { height: 40px; border-radius: 50%; }
    .item-info { flex: 1; min-width: 0; }
    .item-titel { font-weight: 600; overflow-wrap: anywhere; }
    .item-link { font-size: 13px; color: var(--moon); text-decoration: none; font-weight: 600; }
    .item-acties { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .status {
      font-size: 12px; font-weight: 650; padding: 5px 10px; border-radius: 999px; white-space: nowrap;
      background: var(--line); color: var(--text);
    }
    .status.bezig { background: var(--sun-soft); color: var(--sun); }
    .status.klaar { background: var(--good-soft); color: var(--good); }
    .status.heb { background: var(--moon-soft); color: var(--moon); }
    .status.kopen { background: var(--bad-soft); color: var(--bad); }
    .item-meta { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
    .item-meta b { color: var(--text); font-weight: 650; }
    .item-notitie { font-size: 12.5px; color: var(--muted); font-style: italic; margin-top: 3px; }
    .bieb-totaal { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; }
    .bieb-totaal b { font-weight: 700; }
    .volgende { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
    .tip { font-size: 13px; color: var(--sun); background: var(--sun-soft); border-radius: 10px; padding: 9px 11px; margin-top: 10px; line-height: 1.4; }
    .blad select {
      width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font: inherit; color: inherit;
    }

    /* Navigatie */
    nav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
      background: var(--surface); border-top: 1px solid var(--line);
      padding: 6px 4px calc(env(safe-area-inset-bottom) + 6px);
      display: flex; justify-content: center;
    }
    nav .wrap { display: flex; width: 100%; max-width: 640px; gap: 2px; }
    nav button {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 6px 0; font-size: 10px; letter-spacing: -.01em; color: var(--muted); font-weight: 600; min-width: 0; white-space: nowrap;
    }
    nav button .ni { font-size: 20px; line-height: 1.2; filter: grayscale(1); opacity: .6; }
    nav button.aan { color: var(--text); }
    nav button.aan .ni { filter: none; opacity: 1; }

    /* Invoerblad */
    .scherm { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; display: none; align-items: flex-end; justify-content: center; }
    .scherm.open { display: flex; }
    .blad {
      background: var(--surface); width: 100%; max-width: 640px;
      border-radius: 20px 20px 0 0; padding: 20px 20px calc(env(safe-area-inset-bottom) + 20px);
    }
    .blad h3 { font-size: 18px; margin-bottom: 14px; }
    .blad label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
    .blad input {
      width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg);
    }
    .blad .rij { display: flex; gap: 8px; margin-top: 18px; }
    .blad .rij .knop { flex: 1; padding: 13px; }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="datum" id="datum"></div>
      <h1 id="titel">Dashboard</h1>
    </div>
    <div class="kop-knoppen">
      <button class="thema-knop" id="thema-knop" aria-label="Wissel tussen licht en donker">🌙</button>
      <button class="thema-knop" data-ga="settings" id="settings-knop" aria-label="Settings">⚙️</button>
    </div>
  </header>

  <main>
    <!-- DASHBOARD -->
    <section data-view="dashboard" class="actief">
      <div class="welkom" id="welkom">
        <div class="welkom-emoji" id="welkom-emoji">☀️</div>
        <div class="welkom-groet" id="welkom-groet">Welkom</div>
        <p class="welkom-zin" id="welkom-zin" lang="en"></p>
        <p class="welkom-bron" id="welkom-bron"></p>
        <div class="klok">
          <div class="klok-tijd" id="klok-tijd">--:--:--</div>
          <div class="klok-plaats">🌍 Amsterdam · <span id="klok-zone">CET</span></div>
        </div>
      </div>

      <div class="kaart" id="dash-routine">
        <div class="kaart-kop">
          <div class="icoon" id="dash-icoon"></div>
          <h2 id="dash-kop"></h2>
          <span class="sub" id="dash-telling"></span>
        </div>
        <div class="balk"><i id="dash-balk" style="width:0"></i></div>
        <div id="dash-lijst" style="margin-top:6px"></div>
        <div id="dash-compleet"></div>
      </div>
      <p class="sub" id="dash-reeks" style="text-align:center;margin-top:14px"></p>
    </section>

    <!-- OVERZICHT -->
    <section data-view="overzicht">
      <button class="kaart ov-kaart" data-ga="afleren">
        <div class="kaart-kop"><div class="icoon i-bad">✕</div><h2>Slechte gewoontes afleren</h2><span class="pijl">›</span></div>
        <div id="ov-afleren"></div>
      </button>
      <button class="kaart ov-kaart" data-ga="aanleren">
        <div class="kaart-kop"><div class="icoon i-good">＋</div><h2>Goede gewoontes aanleren</h2><span class="pijl">›</span></div>
        <div id="ov-aanleren"></div>
      </button>
      <button class="kaart ov-kaart" data-ga="routine">
        <div class="kaart-kop"><div class="icoon i-sun">☀</div><h2>Ochtend- &amp; avondroutine</h2><span class="pijl">›</span></div>
        <div id="ov-routine"></div>
      </button>

    </section>

    <!-- BIBLIOTHEEK -->
    <section data-view="bibliotheek">
      <div class="tabs">
        <button data-bieb="boeken">📚 Boeken</button>
        <button data-bieb="audio">🎧 Audio</button>
      </div>
      <div id="bieb-lijst"></div>
      <button class="knop breed" id="bieb-nieuw"></button>
    </section>

    <!-- SETTINGS -->
    <section data-view="settings">
      <div class="label" style="margin-top:12px">Back-up</div>
      <div class="kaart">
        <p class="sub">Je gegevens staan alleen op dit apparaat. Maak af en toe een back-up, zodat je niets kwijtraakt bij een nieuwe telefoon.</p>
        <div class="acties">
          <button class="knop zacht klein" id="exporteer">Back-up maken</button>
          <button class="knop zacht klein" id="importeer">Back-up terugzetten</button>
          <input type="file" id="bestand" accept="application/json,.json" hidden>
        </div>
      </div>
    </section>

    <!-- AFLEREN -->
    <section data-view="afleren">
      <p class="sub" style="margin-top:4px">Houd bij hoe lang je al vrij bent van een slechte gewoonte.</p>
      <div id="lijst-afleren"></div>
      <button class="knop breed" data-nieuw="afleren">＋ Slechte gewoonte toevoegen</button>
    </section>

    <!-- AANLEREN -->
    <section data-view="aanleren">
      <p class="sub" style="margin-top:4px">Vink elke dag af wat je gedaan hebt en bouw een reeks op.</p>
      <div id="lijst-aanleren"></div>
      <button class="knop breed" data-nieuw="aanleren">＋ Goede gewoonte toevoegen</button>
    </section>

    <!-- ROUTINE -->
    <section data-view="routine">
      <div class="tabs">
        <button data-moment="ochtend">☀ Ochtend</button>
        <button data-moment="avond">☾ Avond</button>
      </div>
      <div class="kaart">
        <div class="kaart-kop">
          <h2 id="routine-kop"></h2>
          <span class="sub" id="routine-telling"></span>
          <button class="tekstknop" id="routine-bewerk">Bewerken</button>
        </div>
        <div class="balk"><i id="routine-balk" style="width:0"></i></div>
        <div id="routine-lijst" style="margin-top:6px"></div>
        <div id="routine-compleet"></div>
        <form class="toevoegen" id="routine-form">
          <input id="routine-input" placeholder="Nieuwe stap toevoegen" autocomplete="off" enterkeyhint="done">
          <button class="knop" type="submit">＋</button>
        </form>
      </div>
      <p class="sub" id="routine-reeks" style="text-align:center;margin-top:14px"></p>
    </section>
  </main>

  <nav>
    <div class="wrap">
      <button data-ga="dashboard" class="aan"><span class="ni">🏠</span>Dashboard</button>
      <button data-ga="overzicht"><span class="ni">📋</span>Overzicht</button>
      <button data-ga="afleren"><span class="ni">🚫</span>Afleren</button>
      <button data-ga="aanleren"><span class="ni">🌱</span>Aanleren</button>
      <button data-ga="routine"><span class="ni">☀️</span>Routine</button>
      <button data-ga="bibliotheek"><span class="ni">📚</span>Bibliotheek</button>
    </div>
  </nav>

  <!-- Invoerblad voor toevoegen/bewerken -->
  <div class="scherm" id="scherm">
    <form class="blad" id="blad">
      <h3 id="blad-titel"></h3>
      <label for="blad-naam">Naam</label>
      <input id="blad-naam" required autocomplete="off" maxlength="60">
      <div id="blad-start-wrap">
        <label for="blad-start">Vrij sinds</label>
        <input id="blad-start" type="date">
      </div>
      <div class="rij">
        <button type="button" class="knop rood" id="blad-verwijder">Verwijderen</button>
        <button type="button" class="knop zacht" id="blad-annuleer">Annuleren</button>
        <button type="submit" class="knop">Opslaan</button>
      </div>
    </form>
  </div>

  <!-- Invoerblad bibliotheek -->
  <div class="scherm" id="scherm-bieb">
    <form class="blad" id="blad-bieb">
      <h3 id="bieb-titel-kop"></h3>
      <div style="max-height:68vh;overflow:auto">
      <label for="bieb-titel">Titel</label>
      <input id="bieb-titel" required autocomplete="off" maxlength="120">
      <label for="bieb-maker" id="bieb-maker-label">Auteur</label>
      <input id="bieb-maker" autocomplete="off" maxlength="80">
      <div id="bieb-cat-wrap">
        <label for="bieb-cat">Categorie</label>
        <select id="bieb-cat"></select>
      </div>
      <label for="bieb-status">Status</label>
      <select id="bieb-status"></select>
      <div id="bieb-kopen-wrap" style="display:flex;gap:8px">
        <div style="flex:1"><label for="bieb-prio">Prioriteit (#)</label>
          <input id="bieb-prio" type="number" inputmode="numeric" min="1" max="99"></div>
        <div style="flex:1"><label for="bieb-match">Match (%)</label>
          <input id="bieb-match" type="number" inputmode="numeric" min="0" max="100"></div>
      </div>
      <div id="bieb-notitie-wrap">
        <label for="bieb-notitie">Notitie (optioneel)</label>
        <input id="bieb-notitie" autocomplete="off" maxlength="140">
      </div>
      <label for="bieb-link">Link (optioneel)</label>
      <input id="bieb-link" type="text" inputmode="url" autocapitalize="off" autocomplete="off" placeholder="https://">
      </div>
      <div class="rij">
        <button type="button" class="knop rood" id="bieb-verwijder">Verwijderen</button>
        <button type="button" class="knop zacht" id="bieb-annuleer">Annuleren</button>
        <button type="submit" class="knop">Opslaan</button>
      </div>
    </form>
  </div>

  <script>
  (() => {
    // ---------- Opslag (alleen op dit apparaat) ----------
    const SLEUTEL = 'pop-data-v1';
    const leegData = () => ({
      afleren: [],                         // {id, naam, start, terugvallen: [datum]}
      aanleren: [],                        // {id, naam, gedaan: {datum: true}}
      routine: { ochtend: [], avond: [] }, // {id, naam}
      routineGedaan: {},                   // {datum: {stapId: true}}
      bibliotheek: { boeken: [], audio: [] } // boek: {id, titel, maker, categorie, status: kopen|heb|bezig|klaar, prio, match, notitie, link, klaarOp}
    });
    let data = leegData();
    try {
      const opgeslagen = JSON.parse(localStorage.getItem(SLEUTEL));
      if (opgeslagen) data = Object.assign(leegData(), opgeslagen);
    } catch (e) {}
    const bewaar = () => { try { localStorage.setItem(SLEUTEL, JSON.stringify(data)); } catch (e) {} };
    const nieuwId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

    // Startlijst boeken (eenmalig). Velden: titel, auteur, categorie, status, prioriteit, match %, notitie
    const STARTBOEKEN = [
      ['David and Goliath', 'Malcolm Gladwell', 'mentaal', 'klaar'],
      ['Meditations', 'Marcus Aurelius', 'mentaal', 'bezig'],
      ['Thinking, Fast and Slow', 'Daniel Kahneman', 'mentaal', 'kopen', 10, 70],
      ["Man's Search for Meaning", 'Viktor E. Frankl', 'levenslessen', 'kopen', 3, 90],
      ['The Psychology of Money', 'Morgan Housel', 'geld', 'bezig'],
      ['The Little Book of Common Sense Investing', 'John C. Bogle', 'geld', 'bezig'],
      ['The Art of Spending Money', 'Morgan Housel', 'geld', 'heb', null, null, 'Lees na The Psychology of Money'],
      ['A Man for All Markets', 'Edward O. Thorp', 'geld', 'kopen', 4, 85],
      ['Reminiscences of a Stock Operator', 'Edwin Lefèvre', 'geld', 'kopen', 8, 75],
      ['The Intelligent Investor', 'Benjamin Graham', 'geld', 'kopen', 9, 70],
      ['Dopamine Nation', 'Anna Lembke', 'verslavingen', 'kopen', 5, 80],
      ['Dreamland', 'Sam Quinones', 'verslavingen', 'kopen', 7, 75],
      ['The White Sniper', 'Tapio Saarelainen', 'verhalen', 'klaar'],
      ['Operation Garbo', 'Juan Pujol García & Nigel West', 'verhalen', 'klaar'],
      ['The Bomber Mafia', 'Malcolm Gladwell', 'verhalen', 'klaar'],
      ['Unbroken', 'Laura Hillenbrand', 'verhalen', 'kopen', 1, 90],
      ['Bad Blood', 'John Carreyrou', 'verhalen', 'kopen', 2, 90],
      ["Liar's Poker", 'Michael Lewis', 'verhalen', 'kopen', 6, 80]
    ];
    try {
      const b = data.bibliotheek = data.bibliotheek || { boeken: [], audio: [] };
      b.boeken = b.boeken || []; b.audio = b.audio || [];
      if (!localStorage.getItem('pop-startboeken-2')) {
        b.boeken = b.boeken.filter(x => x.id !== 'start8');   // eerder toegevoegd, staat niet in je lijst
        STARTBOEKEN.forEach(([titel, maker, categorie, status, prio = null, match = null, notitie = ''], i) => {
          const velden = { titel, maker, categorie, status, prio, match, notitie };
          const x = b.boeken.find(y => y.titel.trim().toLowerCase() === titel.toLowerCase());
          if (!x) b.boeken.push({ id: 'boek' + i, link: '', klaarOp: null, ...velden });
          else if (String(x.id).startsWith('start')) Object.assign(x, velden);
          else ['categorie', 'prio', 'match', 'notitie'].forEach(k => { if (x[k] == null || x[k] === '') x[k] = velden[k]; });
        });
        localStorage.setItem('pop-startboeken-2', '1');
      }
      b.boeken.forEach(x => { if (x.status === 'wil') x.status = 'kopen'; if (!x.categorie) x.categorie = 'overig'; });
      bewaar();
    } catch (e) {}

    // ---------- Datums ----------
    const sleutel = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const vandaag = () => sleutel(new Date());
    const naarDatum = s => { const [j, m, d] = s.split('-').map(Number); return new Date(j, m - 1, d); };
    const dagenTussen = (a, b) => Math.round((Date.UTC(...b.split('-').map((n, i) => i === 1 ? n - 1 : +n)) - Date.UTC(...a.split('-').map((n, i) => i === 1 ? n - 1 : +n))) / 864e5);
    const plusDagen = (s, n) => { const d = naarDatum(s); d.setDate(d.getDate() + n); return sleutel(d); };
    const dagNaam = s => naarDatum(s).toLocaleDateString('nl-NL', { weekday: 'short' }).slice(0, 2);
    const dagen = n => n === 1 ? 'dag' : 'dagen';
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // ---------- Berekeningen ----------
    function vrijInfo(g) {
      const t = vandaag();
      const momenten = [g.start, ...[...g.terugvallen].sort()];
      const laatste = momenten[momenten.length - 1];
      let record = 0;
      for (let i = 1; i < momenten.length; i++) record = Math.max(record, dagenTussen(momenten[i - 1], momenten[i]));
      const nu = Math.max(0, dagenTussen(laatste, t));
      return { nu, record: Math.max(record, nu), terugvallen: g.terugvallen.length };
    }
    function reeks(isGedaan) {
      let d = vandaag(), n = 0;
      if (!isGedaan(d)) d = plusDagen(d, -1);   // vandaag nog niet gedaan: reeks van gisteren telt nog
      while (isGedaan(d)) { n++; d = plusDagen(d, -1); }
      return n;
    }
    const routineCompleet = (moment, d) => {
      const stappen = data.routine[moment];
      const gedaan = data.routineGedaan[d] || {};
      return stappen.length > 0 && stappen.every(s => gedaan[s.id]);
    };
    const routineTelling = (moment, d) => {
      const gedaan = data.routineGedaan[d] || {};
      const stappen = data.routine[moment];
      return { klaar: stappen.filter(s => gedaan[s.id]).length, totaal: stappen.length };
    };

    // ---------- Navigatie ----------
    const titels = { dashboard: 'Dashboard', overzicht: 'Overzicht', afleren: 'Afleren', aanleren: 'Aanleren', routine: 'Routine', bibliotheek: 'Bibliotheek', settings: 'Settings' };
    let huidig = 'dashboard';
    function ga(view) {
      huidig = view;
      document.querySelectorAll('section[data-view]').forEach(s => s.classList.toggle('actief', s.dataset.view === view));
      document.querySelectorAll('nav button, #settings-knop').forEach(b => b.classList.toggle('aan', b.dataset.ga === view));
      document.getElementById('titel').textContent = titels[view];
      try { sessionStorage.setItem('pop-view', view); } catch (e) {}
      window.scrollTo(0, 0);
      teken();
    }
    document.addEventListener('click', e => {
      const b = e.target.closest('[data-ga]');
      if (b) ga(b.dataset.ga);
    });

    // ---------- Overzicht ----------
    function tekenOverzicht() {
      const t = vandaag();
      // Afleren
      const af = document.getElementById('ov-afleren');
      if (!data.afleren.length) af.innerHTML = '<p class="sub" style="margin-top:10px">Nog niets toegevoegd</p>';
      else {
        const infos = data.afleren.map(g => ({ naam: g.naam, ...vrijInfo(g) }));
        af.innerHTML = infos.map(i => `<div class="ov-rij" style="grid-template-columns:1fr auto;margin-top:10px">
          <span>${esc(i.naam)}</span><b>${i.nu} ${dagen(i.nu)} vrij</b></div>`).join('');
      }
      // Aanleren
      const aan = document.getElementById('ov-aanleren');
      if (!data.aanleren.length) aan.innerHTML = '<p class="sub" style="margin-top:10px">Nog niets toegevoegd</p>';
      else {
        const klaar = data.aanleren.filter(g => g.gedaan[t]).length, tot = data.aanleren.length;
        aan.innerHTML = `<div class="ov-getal">${klaar}/${tot}<small>vandaag gedaan</small></div>
          <div class="balk"><i style="width:${Math.round(klaar / tot * 100)}%"></i></div>`;
      }
      // Routine
      const ro = document.getElementById('ov-routine');
      const o = routineTelling('ochtend', t), a = routineTelling('avond', t);
      if (!o.totaal && !a.totaal) ro.innerHTML = '<p class="sub" style="margin-top:10px">Nog niets toegevoegd</p>';
      else ro.innerHTML = `<div class="ov-rij">${[['☀ Ochtend', o], ['☾ Avond', a]].map(([n, c]) => `
          <div><div class="sub"><span>${n}</span><span>${c.klaar}/${c.totaal}</span></div>
          <div class="balk"><i style="width:${c.totaal ? Math.round(c.klaar / c.totaal * 100) : 0}%"></i></div></div>`).join('')}</div>`;
    }

    // ---------- Afleren ----------
    function tekenAfleren() {
      const el = document.getElementById('lijst-afleren');
      if (!data.afleren.length) {
        el.innerHTML = '<div class="leeg"><strong>Nog geen slechte gewoontes</strong>Voeg een gewoonte toe die je wilt afleren, bijvoorbeeld snoepen of laat naar bed gaan.</div>';
        return;
      }
      el.innerHTML = data.afleren.map(g => {
        const i = vrijInfo(g);
        return `<div class="kaart">
          <div class="kaart-kop"><div class="icoon i-bad">✕</div><h2>${esc(g.naam)}</h2>
            <button class="tekstknop" data-bewerk="afleren" data-id="${g.id}">Bewerken</button></div>
          <div class="vrij"><b>${i.nu}</b><span>${dagen(i.nu)} vrij</span></div>
          <div class="stats sub"><span>Record: ${i.record} ${dagen(i.record)}</span><span>Teruggevallen: ${i.terugvallen}×</span></div>
          <div class="acties">
            <button class="knop rood klein" data-terugval="${g.id}">Teruggevallen</button>
            ${g.terugvallen.length ? `<button class="tekstknop" data-herstel="${g.id}">Laatste terugval ongedaan maken</button>` : ''}
          </div>
        </div>`;
      }).join('');
    }
    document.getElementById('lijst-afleren').addEventListener('click', e => {
      const tv = e.target.closest('[data-terugval]'), hs = e.target.closest('[data-herstel]');
      if (tv) {
        const g = data.afleren.find(x => x.id === tv.dataset.terugval);
        if (g && confirm(`Teruggevallen bij "${g.naam}"? Je teller begint dan opnieuw bij 0. Geeft niks, morgen weer een dag.`)) {
          g.terugvallen.push(vandaag()); bewaar(); teken();
        }
      }
      if (hs) {
        const g = data.afleren.find(x => x.id === hs.dataset.herstel);
        if (g) { g.terugvallen.sort(); g.terugvallen.pop(); bewaar(); teken(); }
      }
    });

    // ---------- Aanleren ----------
    function tekenAanleren() {
      const el = document.getElementById('lijst-aanleren');
      if (!data.aanleren.length) {
        el.innerHTML = '<div class="leeg"><strong>Nog geen goede gewoontes</strong>Voeg een gewoonte toe die je wilt aanleren, bijvoorbeeld 10 minuten lezen of een wandeling.</div>';
        return;
      }
      const t = vandaag();
      const week = Array.from({ length: 7 }, (_, i) => plusDagen(t, i - 6));
      el.innerHTML = data.aanleren.map(g => {
        const r = reeks(d => !!g.gedaan[d]);
        return `<div class="kaart">
          <div class="gw-rij">
            <button class="vink ${g.gedaan[t] ? 'aan' : ''}" data-vink="${g.id}" aria-label="Vandaag gedaan">✓</button>
            <div class="gw-info"><div class="gw-naam">${esc(g.naam)}</div>
              <div class="sub">${r ? `🔥 ${r} ${dagen(r)} op rij` : 'Nog geen reeks'}</div></div>
            <button class="tekstknop" data-bewerk="aanleren" data-id="${g.id}">Bewerken</button>
          </div>
          <div class="week">${week.map(d => `<div class="dag ${g.gedaan[d] ? 'ja' : ''} ${d === t ? 'vandaag' : ''}">${dagNaam(d)}<i></i></div>`).join('')}</div>
        </div>`;
      }).join('');
    }
    document.getElementById('lijst-aanleren').addEventListener('click', e => {
      const v = e.target.closest('[data-vink]');
      if (!v) return;
      const g = data.aanleren.find(x => x.id === v.dataset.vink), t = vandaag();
      if (g.gedaan[t]) delete g.gedaan[t]; else g.gedaan[t] = true;
      bewaar(); teken();
    });

    // ---------- Amsterdam-tijd ----------
    const tijdFmt = new Intl.DateTimeFormat('nl-NL', { timeZone: 'Europe/Amsterdam', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
    const zoneFmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Amsterdam', timeZoneName: 'short' });
    function amsterdam() {
      const p = Object.fromEntries(tijdFmt.formatToParts(new Date()).map(x => [x.type, x.value]));
      const zone = (zoneFmt.formatToParts(new Date()).find(x => x.type === 'timeZoneName') || {}).value || 'CET';
      return { u: +p.hour, m: +p.minute, s: +p.second, hh: p.hour, mm: p.minute, ss: p.second,
               zone: zone === 'GMT+1' ? 'CET' : zone === 'GMT+2' ? 'CEST' : zone };
    }
    // 06:00 t/m 13:00 = ochtend, 13:01 t/m 21:59 = middag (geen routine), 22:00 t/m 05:59 = avond
    function momentNu() {
      const { u, m } = amsterdam(), min = u * 60 + m;
      if (min >= 360 && min <= 780) return 'ochtend';
      if (min > 780 && min < 1320) return 'middag';
      return 'avond';
    }

    // Avondroutine na middernacht (00:00-05:59) telt nog voor de avond ervoor
    const routineDag = m => (m === 'avond' && amsterdam().u < 6) ? plusDagen(vandaag(), -1) : vandaag();

    // ---------- Dashboard ----------
    // Klassieke teksten in het Engels (o.b.v. publiek-domein vertalingen: Long, Gummere)
    const zinnen = {
      ochtend: [
        ['In the morning when you rise unwillingly, let this thought be present: I am rising to the work of a human being.', 'Marcus Aurelius, Meditations 5.1'],
        ['No longer talk at all about the kind of man that a good man ought to be, but be such.', 'Marcus Aurelius, Meditations 10.16'],
        ['First say to yourself what you would be; and then do what you have to do.', 'Epictetus, Discourses 3.23'],
        ['While we are postponing, life speeds by.', 'Seneca, Letters to Lucilius 1'],
        ['Know thyself.', 'Inscription at the Temple of Apollo, Delphi'],
        ['No great thing is created suddenly, any more than a bunch of grapes or a fig.', 'Epictetus, Discourses 1.15'],
        ['The universe is transformation: life is opinion.', 'Marcus Aurelius, Meditations 4.3']
      ],
      middag: [
        ['Some things are in our control and others not.', 'Epictetus, Enchiridion 1'],
        ['Men are disturbed not by the things which happen, but by the opinions about the things.', 'Epictetus, Enchiridion 5'],
        ['We suffer more often in imagination than in reality.', 'Seneca, Letters to Lucilius 13'],
        ['It is not that we have a short time to live, but that we waste a lot of it.', 'Seneca, On the Shortness of Life 1'],
        ['Every habit and faculty is maintained and increased by the corresponding actions.', 'Epictetus, Discourses 2.18'],
        ['Nothing in excess.', 'Inscription at the Temple of Apollo, Delphi'],
        ['Odysseus had himself bound to the mast to resist the song of the Sirens. Bind yourself to your intentions.', 'Lesson from Homer\'s Odyssey']
      ],
      avond: [
        ['I examine my entire day and go back over what I have done and said.', 'Seneca, On Anger 3.36'],
        ['Such as are your habitual thoughts, such also will be the character of your mind; for the soul is dyed by the thoughts.', 'Marcus Aurelius, Meditations 5.16'],
        ['Look within. Within is the fountain of good, and it will ever bubble up, if you will ever dig.', 'Marcus Aurelius, Meditations 7.59'],
        ['The best way of avenging yourself is not to become like the wrongdoer.', 'Marcus Aurelius, Meditations 6.6'],
        ['Be like the promontory against which the waves continually break; it stands firm and tames the fury of the water around it.', 'Marcus Aurelius, Meditations 4.49'],
        ['When Pandora opened the jar and every evil escaped into the world, one thing remained inside: hope.', 'Myth of Pandora, after Hesiod'],
        ['Do every act of your life as if it were the last.', 'Marcus Aurelius, Meditations 2.5']
      ]
    };
    function groet(u) {
      if (u >= 6 && u < 12) return ['Goedemorgen', '☀️'];
      if (u >= 12 && u < 18) return ['Goedemiddag', '🌤️'];
      if (u >= 18 && u < 24) return ['Goedenavond', '🌙'];
      return ['Goedenacht', '✨'];
    }
    function tekenKlok() {
      const a = amsterdam();
      document.getElementById('klok-tijd').textContent = `${a.hh}:${a.mm}:${a.ss}`;
      document.getElementById('klok-zone').textContent = a.zone;
    }
    let dashMoment = null;
    function tekenDashboard() {
      const a = amsterdam(), m = momentNu(), t = routineDag(m);
      dashMoment = m;
      const [g, emoji] = groet(a.u);
      const dagNr = Math.floor(Date.now() / 864e5);
      document.getElementById('welkom').classList.toggle('avond', m === 'avond');
      document.getElementById('welkom-emoji').textContent = emoji;
      document.getElementById('welkom-groet').textContent = `${g}, Joshua!`;
      const [zin, bron] = zinnen[m][dagNr % zinnen[m].length];
      document.getElementById('welkom-zin').textContent = `“${zin}”`;
      document.getElementById('welkom-bron').textContent = `— ${bron}`;
      tekenKlok();

      const toonRoutine = m !== 'middag';
      document.getElementById('dash-routine').style.display = toonRoutine ? '' : 'none';
      document.getElementById('dash-reeks').style.display = toonRoutine ? '' : 'none';
      if (!toonRoutine) return;
      const ic = document.getElementById('dash-icoon');
      ic.className = 'icoon ' + (m === 'ochtend' ? 'i-sun' : 'i-moon');
      ic.textContent = m === 'ochtend' ? '☀' : '☾';
      document.getElementById('dash-kop').textContent = m === 'ochtend' ? 'Ochtendroutine' : 'Avondroutine';
      const stappen = data.routine[m], gedaan = data.routineGedaan[t] || {}, c = routineTelling(m, t);
      document.getElementById('dash-telling').textContent = c.totaal ? `${c.klaar}/${c.totaal}` : '';
      document.getElementById('dash-balk').style.width = c.totaal ? `${Math.round(c.klaar / c.totaal * 100)}%` : '0';
      document.getElementById('dash-lijst').innerHTML = stappen.length
        ? stappen.map(s => `<button class="stap ${gedaan[s.id] ? 'aan' : ''}" data-stap="${s.id}"><span class="box">✓</span><span class="tekst">${esc(s.naam)}</span></button>`).join('')
        : `<p class="sub" style="padding:14px 0">Nog geen stappen. <button class="tekstknop" data-ga="routine" style="padding:0;text-decoration:underline">Stel je ${m === 'ochtend' ? 'ochtend' : 'avond'}routine in</button></p>`;
      document.getElementById('dash-compleet').innerHTML = routineCompleet(m, t) ? '<p class="compleet">✓ Routine compleet, top gedaan!</p>' : '';
      const r = reeks(d => routineCompleet(m, d));
      document.getElementById('dash-reeks').textContent = r ? `🔥 ${r} ${dagen(r)} op rij volledig` : '';
    }
    document.getElementById('dash-lijst').addEventListener('click', e => {
      const s = e.target.closest('[data-stap]');
      if (!s) return;
      const t = routineDag(dashMoment), g = data.routineGedaan[t] = data.routineGedaan[t] || {};
      if (g[s.dataset.stap]) delete g[s.dataset.stap]; else g[s.dataset.stap] = true;
      bewaar(); teken();
    });
    setInterval(() => {
      if (huidig !== 'dashboard' || document.hidden) return;
      const a = amsterdam();
      if (momentNu() !== dashMoment || a.s === 0) tekenDashboard(); else tekenKlok();
    }, 1000);

    // ---------- Routine ----------
    let moment = momentNu() === 'middag' ? 'avond' : momentNu();
    let bewerkModus = false;
    function tekenRoutine() {
      const t = routineDag(moment);
      document.querySelectorAll('[data-moment]').forEach(b => b.classList.toggle('aan', b.dataset.moment === moment));
      document.getElementById('routine-kop').textContent = moment === 'ochtend' ? 'Ochtendroutine' : 'Avondroutine';
      const stappen = data.routine[moment];
      const gedaan = data.routineGedaan[t] || {};
      const c = routineTelling(moment, t);
      document.getElementById('routine-telling').textContent = c.totaal ? `${c.klaar}/${c.totaal}` : '';
      document.getElementById('routine-balk').style.width = c.totaal ? `${Math.round(c.klaar / c.totaal * 100)}%` : '0';
      document.getElementById('routine-bewerk').textContent = bewerkModus ? 'Klaar' : 'Bewerken';
      document.getElementById('routine-bewerk').style.visibility = stappen.length ? 'visible' : 'hidden';
      document.getElementById('routine-lijst').innerHTML = stappen.length
        ? stappen.map(s => bewerkModus
            ? `<div class="stap"><span class="tekst">${esc(s.naam)}</span><button class="weg" data-weg="${s.id}">Verwijderen</button></div>`
            : `<button class="stap ${gedaan[s.id] ? 'aan' : ''}" data-stap="${s.id}"><span class="box">✓</span><span class="tekst">${esc(s.naam)}</span></button>`).join('')
        : `<p class="sub" style="padding:14px 0">Nog geen stappen. Voeg hieronder je eerste stap toe.</p>`;
      document.getElementById('routine-compleet').innerHTML = !bewerkModus && routineCompleet(moment, t) ? '<p class="compleet">✓ Routine compleet!</p>' : '';
      const r = reeks(d => routineCompleet(moment, d));
      document.getElementById('routine-reeks').textContent = r ? `🔥 ${r} ${dagen(r)} op rij volledig` : '';
    }
    document.querySelector('.tabs').addEventListener('click', e => {
      const b = e.target.closest('[data-moment]');
      if (b) { moment = b.dataset.moment; bewerkModus = false; teken(); }
    });
    document.getElementById('routine-bewerk').addEventListener('click', () => { bewerkModus = !bewerkModus; teken(); });
    document.getElementById('routine-lijst').addEventListener('click', e => {
      const s = e.target.closest('[data-stap]'), w = e.target.closest('[data-weg]');
      const t = routineDag(moment);
      if (s) {
        const g = data.routineGedaan[t] = data.routineGedaan[t] || {};
        if (g[s.dataset.stap]) delete g[s.dataset.stap]; else g[s.dataset.stap] = true;
        bewaar(); teken();
      }
      if (w) {
        data.routine[moment] = data.routine[moment].filter(x => x.id !== w.dataset.weg);
        if (!data.routine[moment].length) bewerkModus = false;
        bewaar(); teken();
      }
    });
    document.getElementById('routine-form').addEventListener('submit', e => {
      e.preventDefault();
      const inp = document.getElementById('routine-input');
      const naam = inp.value.trim();
      if (!naam) return;
      data.routine[moment].push({ id: nieuwId(), naam });
      inp.value = '';
      bewaar(); teken();
    });

    // ---------- Invoerblad (toevoegen / bewerken) ----------
    const scherm = document.getElementById('scherm');
    let bladSoort = null, bladId = null;
    function openBlad(soort, id) {
      bladSoort = soort; bladId = id || null;
      const item = id ? data[soort].find(x => x.id === id) : null;
      document.getElementById('blad-titel').textContent =
        (item ? 'Bewerken: ' : '') + (soort === 'afleren' ? 'Slechte gewoonte' : 'Goede gewoonte');
      document.getElementById('blad-naam').value = item ? item.naam : '';
      document.getElementById('blad-start-wrap').style.display = soort === 'afleren' ? 'block' : 'none';
      document.getElementById('blad-start').value = item && item.start ? item.start : vandaag();
      document.getElementById('blad-start').max = vandaag();
      document.getElementById('blad-verwijder').style.display = item ? 'inline-flex' : 'none';
      scherm.classList.add('open');
      setTimeout(() => document.getElementById('blad-naam').focus(), 50);
    }
    const sluitBlad = () => scherm.classList.remove('open');
    document.addEventListener('click', e => {
      const n = e.target.closest('[data-nieuw]'), b = e.target.closest('[data-bewerk]');
      if (n) openBlad(n.dataset.nieuw);
      if (b) openBlad(b.dataset.bewerk, b.dataset.id);
    });
    document.getElementById('blad-annuleer').addEventListener('click', sluitBlad);
    scherm.addEventListener('click', e => { if (e.target === scherm) sluitBlad(); });
    document.getElementById('blad').addEventListener('submit', e => {
      e.preventDefault();
      const naam = document.getElementById('blad-naam').value.trim();
      if (!naam) return;
      let start = document.getElementById('blad-start').value || vandaag();
      if (start > vandaag()) start = vandaag();
      const lijst = data[bladSoort];
      const item = bladId ? lijst.find(x => x.id === bladId) : null;
      if (item) { item.naam = naam; if (bladSoort === 'afleren') item.start = start; }
      else if (bladSoort === 'afleren') lijst.push({ id: nieuwId(), naam, start, terugvallen: [] });
      else lijst.push({ id: nieuwId(), naam, gedaan: {} });
      bewaar(); sluitBlad(); teken();
    });
    document.getElementById('blad-verwijder').addEventListener('click', () => {
      const item = data[bladSoort].find(x => x.id === bladId);
      if (item && confirm(`"${item.naam}" verwijderen? Je voortgang hiervan gaat verloren.`)) {
        data[bladSoort] = data[bladSoort].filter(x => x.id !== bladId);
        bewaar(); sluitBlad(); teken();
      }
    });

    // ---------- Back-up ----------
    document.getElementById('exporteer').addEventListener('click', async () => {
      const json = JSON.stringify(data, null, 2);
      const naam = `pop-backup-${vandaag()}.json`;
      const file = new File([json], naam, { type: 'application/json' });
      try {
        if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: naam }); return; }
      } catch (e) { if (e.name === 'AbortError') return; }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(file); a.download = naam; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });
    document.getElementById('importeer').addEventListener('click', () => document.getElementById('bestand').click());
    document.getElementById('bestand').addEventListener('change', async e => {
      const f = e.target.files[0]; e.target.value = '';
      if (!f) return;
      try {
        const nieuw = JSON.parse(await f.text());
        if (!nieuw || !Array.isArray(nieuw.afleren) || !Array.isArray(nieuw.aanleren) || !nieuw.routine) throw 0;
        if (!confirm('Back-up terugzetten? Wat nu in de app staat wordt vervangen.')) return;
        data = Object.assign(leegData(), nieuw); bewaar(); teken();
        alert('Back-up teruggezet.');
      } catch (err) { alert('Dit bestand is geen geldige POP-back-up.'); }
    });

    // ---------- Bibliotheek ----------
    const BIEB = {
      boeken: { enkel: 'Boek', maker: 'Auteur',
                volgorde: ['bezig', 'heb', 'kopen', 'klaar'], start: 'kopen',
                cyclus: { kopen: 'heb', heb: 'bezig', bezig: 'klaar', klaar: 'kopen' },
                status: { bezig: '📖 Bezig', heb: '📚 Heb ik', kopen: '🛒 Nog kopen', klaar: '✅ Gelezen' },
                lang: { bezig: 'bezig', heb: 'heb ik', kopen: 'nog kopen', klaar: 'gelezen' },
                leeg: 'Voeg een boek toe dat je wilt lezen, aan het lezen bent of al gelezen hebt.' },
      audio:  { enkel: 'Audio', maker: 'Maker / spreker',
                volgorde: ['bezig', 'wil', 'klaar'], start: 'wil',
                cyclus: { wil: 'bezig', bezig: 'klaar', klaar: 'wil' },
                status: { wil: 'Wil ik luisteren', bezig: 'Aan het luisteren', klaar: 'Geluisterd' },
                leeg: 'Voeg een luisterboek of podcast toe. Met een link open je hem direct vanuit de app.' }
    };
    const CATEGORIEEN = {
      mentaal: '🧠 Mentale ontwikkeling & self-doubt',
      levenslessen: '🧭 Levenslessen',
      geld: '💰 Geld & investeren',
      verslavingen: '🚬 Verslavingen',
      verhalen: '📰 Interessante verhalen',
      overig: '📎 Overig'
    };
    const kleuren = ['#c0674f', '#4b5fa8', '#2f8a4a', '#8a5aa8', '#d48a1c', '#3d8a96', '#a8506e'];
    const kleurVoor = t => kleuren[[...t].reduce((a, c) => a + c.charCodeAt(0), 0) % kleuren.length];
    const letter = t => esc((t.trim().replace(/^(the|a|an|de|het|een)\s+/i, '')[0] || '?').toUpperCase());
    let biebSoort = 'boeken';
    const veiligeLink = l => /^https?:\/\//i.test(l || '') ? l : '';

    function itemHTML(x) {
      const cfg = BIEB[biebSoort], link = veiligeLink(x.link);
      const kopen = biebSoort === 'boeken' && x.status === 'kopen' && (x.prio || x.match);
      return `<div class="item">
        <div class="omslag ${biebSoort === 'audio' ? 'audio' : ''}" style="background:${kleurVoor(x.titel)}">${letter(x.titel)}</div>
        <div class="item-info">
          <div class="item-titel">${esc(x.titel)}</div>
          ${x.maker ? `<div class="sub">${esc(x.maker)}</div>` : ''}
          ${kopen ? `<div class="item-meta">${x.prio ? `<b>#${x.prio}</b>` : ''}${x.prio && x.match ? ' · ' : ''}${x.match ? `ca. ${x.match}% match` : ''}</div>` : ''}
          ${x.notitie ? `<div class="item-notitie">${esc(x.notitie)}</div>` : ''}
          ${link ? `<a class="item-link" href="${esc(link)}" target="_blank" rel="noopener">${biebSoort === 'audio' ? '▶ Luisteren' : '↗ Openen'}</a>` : ''}
        </div>
        <div class="item-acties">
          <button class="status ${x.status}" data-status="${x.id}">${cfg.status[x.status] || x.status}</button>
          <button class="tekstknop" data-bieb-bewerk="${x.id}">Bewerken</button>
        </div>
      </div>`;
    }
    const sorteer = (a, b, cfg) =>
      cfg.volgorde.indexOf(a.status) - cfg.volgorde.indexOf(b.status) ||
      (a.status === 'kopen' ? (a.prio || 99) - (b.prio || 99) : 0);

    function tekenBibliotheek() {
      const cfg = BIEB[biebSoort], lijst = data.bibliotheek[biebSoort];
      document.querySelectorAll('[data-bieb]').forEach(b => b.classList.toggle('aan', b.dataset.bieb === biebSoort));
      document.getElementById('bieb-nieuw').textContent = `＋ ${cfg.enkel} toevoegen`;
      const el = document.getElementById('bieb-lijst');
      if (!lijst.length) { el.innerHTML = `<div class="leeg"><strong>Nog leeg</strong>${cfg.leeg}</div>`; return; }

      if (biebSoort === 'audio') {
        el.innerHTML = cfg.volgorde.map(st => {
          const items = lijst.filter(x => x.status === st);
          if (!items.length) return '';
          return `<div class="label bieb-groep"><span>${cfg.status[st]}</span><span>${items.length}</span></div>
            <div class="kaart" style="padding-top:4px;padding-bottom:4px">${items.map(itemHTML).join('')}</div>`;
        }).join('');
        return;
      }

      // Boeken: totaal + volgende aankoop, daarna per categorie
      const tel = st => lijst.filter(x => x.status === st).length;
      const volgende = lijst.filter(x => x.status === 'kopen').sort((a, b) => (a.prio || 99) - (b.prio || 99))[0];
      const open = tel('bezig');
      let html = `<div class="kaart">
        <div class="bieb-totaal">${['klaar', 'bezig', 'heb', 'kopen'].map(st =>
          `<span>${cfg.status[st].split(' ')[0]} <b>${tel(st)}</b> ${cfg.lang[st]}</span>`).join('')}</div>
        ${volgende ? `<div class="volgende">
            <div class="omslag" style="background:${kleurVoor(volgende.titel)}">${letter(volgende.titel)}</div>
            <div class="item-info"><div class="sub">Volgende aankoop</div>
              <div class="item-titel">${esc(volgende.titel)}</div>
              <div class="item-meta">${volgende.prio ? `<b>#${volgende.prio}</b>` : ''}${volgende.match ? ` · ca. ${volgende.match}% match` : ''}</div></div>
          </div>` : ''}
        ${volgende && open >= 3 ? `<div class="tip">💡 Je hebt nu ${open} boeken open. Wacht met de volgende aankoop tot je er één uit hebt.</div>` : ''}
      </div>`;
      html += Object.entries(CATEGORIEEN).map(([k, naam]) => {
        const items = lijst.filter(x => (x.categorie || 'overig') === k).sort((a, b) => sorteer(a, b, cfg));
        if (!items.length) return '';
        return `<div class="label bieb-groep"><span>${naam}</span><span>${items.length}</span></div>
          <div class="kaart" style="padding-top:4px;padding-bottom:4px">${items.map(itemHTML).join('')}</div>`;
      }).join('');
      el.innerHTML = html;
    }
    document.querySelector('[data-view=bibliotheek] .tabs').addEventListener('click', e => {
      const b = e.target.closest('[data-bieb]');
      if (b) { biebSoort = b.dataset.bieb; teken(); }
    });
    document.getElementById('bieb-lijst').addEventListener('click', e => {
      const st = e.target.closest('[data-status]'), bw = e.target.closest('[data-bieb-bewerk]');
      if (st) {   // tik op status → volgende stap
        const x = data.bibliotheek[biebSoort].find(i => i.id === st.dataset.status);
        x.status = BIEB[biebSoort].cyclus[x.status] || BIEB[biebSoort].start;
        x.klaarOp = x.status === 'klaar' ? vandaag() : null;
        bewaar(); teken();
      }
      if (bw) openBieb(bw.dataset.biebBewerk);
    });
    const schermBieb = document.getElementById('scherm-bieb');
    let biebId = null;
    const toonKopenVelden = () => {
      document.getElementById('bieb-kopen-wrap').style.display =
        biebSoort === 'boeken' && document.getElementById('bieb-status').value === 'kopen' ? 'flex' : 'none';
    };
    document.getElementById('bieb-status').addEventListener('change', toonKopenVelden);
    function openBieb(id) {
      biebId = id || null;
      const cfg = BIEB[biebSoort], boek = biebSoort === 'boeken';
      const x = id ? data.bibliotheek[biebSoort].find(i => i.id === id) : null;
      document.getElementById('bieb-titel-kop').textContent = (x ? 'Bewerken: ' : 'Nieuw: ') + cfg.enkel.toLowerCase();
      document.getElementById('bieb-maker-label').textContent = cfg.maker;
      document.getElementById('bieb-titel').value = x ? x.titel : '';
      document.getElementById('bieb-maker').value = x ? x.maker || '' : '';
      document.getElementById('bieb-link').value = x ? x.link || '' : '';
      document.getElementById('bieb-notitie').value = x ? x.notitie || '' : '';
      document.getElementById('bieb-prio').value = x && x.prio ? x.prio : '';
      document.getElementById('bieb-match').value = x && x.match ? x.match : '';
      document.getElementById('bieb-cat-wrap').style.display = boek ? 'block' : 'none';
      document.getElementById('bieb-cat').innerHTML = Object.entries(CATEGORIEEN)
        .map(([k, v]) => `<option value="${k}" ${(x ? x.categorie : 'overig') === k ? 'selected' : ''}>${v}</option>`).join('');
      document.getElementById('bieb-status').innerHTML = cfg.volgorde
        .map(k => `<option value="${k}" ${(x ? x.status : cfg.start) === k ? 'selected' : ''}>${cfg.status[k]}</option>`).join('');
      toonKopenVelden();
      document.getElementById('bieb-verwijder').style.display = x ? 'inline-flex' : 'none';
      schermBieb.classList.add('open');
      setTimeout(() => document.getElementById('bieb-titel').focus(), 50);
    }
    const sluitBieb = () => schermBieb.classList.remove('open');
    document.getElementById('bieb-nieuw').addEventListener('click', () => openBieb());
    document.getElementById('bieb-annuleer').addEventListener('click', sluitBieb);
    schermBieb.addEventListener('click', e => { if (e.target === schermBieb) sluitBieb(); });
    document.getElementById('blad-bieb').addEventListener('submit', e => {
      e.preventDefault();
      const titel = document.getElementById('bieb-titel').value.trim();
      if (!titel) return;
      let link = document.getElementById('bieb-link').value.trim();
      if (link && !/^https?:\/\//i.test(link)) link = 'https://' + link;
      const getal = id => { const v = parseInt(document.getElementById(id).value, 10); return isNaN(v) ? null : v; };
      const velden = { titel, maker: document.getElementById('bieb-maker').value.trim(),
                       status: document.getElementById('bieb-status').value, link,
                       notitie: document.getElementById('bieb-notitie').value.trim() };
      if (biebSoort === 'boeken') Object.assign(velden, {
        categorie: document.getElementById('bieb-cat').value, prio: getal('bieb-prio'), match: getal('bieb-match') });
      const lijst = data.bibliotheek[biebSoort];
      const x = biebId ? lijst.find(i => i.id === biebId) : null;
      if (x) {
        velden.klaarOp = velden.status === 'klaar' ? (x.status === 'klaar' ? x.klaarOp : vandaag()) : null;
        Object.assign(x, velden);
      } else lijst.push({ id: nieuwId(), ...velden, klaarOp: velden.status === 'klaar' ? vandaag() : null });
      bewaar(); sluitBieb(); teken();
    });
    document.getElementById('bieb-verwijder').addEventListener('click', () => {
      const x = data.bibliotheek[biebSoort].find(i => i.id === biebId);
      if (x && confirm(`"${x.titel}" verwijderen?`)) {
        data.bibliotheek[biebSoort] = data.bibliotheek[biebSoort].filter(i => i.id !== biebId);
        bewaar(); sluitBieb(); teken();
      }
    });

    // ---------- Licht / donker ----------
    const donkerSysteem = window.matchMedia('(prefers-color-scheme: dark)');
    const isDonker = () => document.documentElement.dataset.theme
      ? document.documentElement.dataset.theme === 'dark' : donkerSysteem.matches;
    function tekenThema() {
      const d = isDonker();
      document.getElementById('thema-knop').textContent = d ? '☀️' : '🌙';
      document.querySelector('meta[name=theme-color]').content = d ? '#12151c' : '#f6f5f1';
    }
    document.getElementById('thema-knop').addEventListener('click', () => {
      const nieuw = isDonker() ? 'light' : 'dark';
      document.documentElement.dataset.theme = nieuw;
      try { localStorage.setItem('pop-thema', nieuw); } catch (e) {}
      tekenThema();
    });
    donkerSysteem.addEventListener('change', tekenThema);
    tekenThema();

    // ---------- Tekenen ----------
    function teken() {
      document.getElementById('datum').textContent =
        new Date().toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' });
      if (huidig === 'dashboard') tekenDashboard();
      if (huidig === 'overzicht') tekenOverzicht();
      if (huidig === 'afleren') tekenAfleren();
      if (huidig === 'aanleren') tekenAanleren();
      if (huidig === 'routine') tekenRoutine();
      if (huidig === 'bibliotheek') tekenBibliotheek();
    }
    // Nieuwe dag? Opnieuw tekenen wanneer je de app weer opent.
    document.addEventListener('visibilitychange', () => { if (!document.hidden) teken(); });

    let start = 'dashboard';
    try { start = sessionStorage.getItem('pop-view') || 'dashboard'; } catch (e) {}
    ga(titels[start] ? start : 'dashboard');

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  })();
  </script>
</body>
</html>
